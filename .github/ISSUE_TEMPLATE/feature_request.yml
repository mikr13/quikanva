name: Feature request
description: Propose a focused improvement to the native quick-canvas workflow
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what friction do you hit today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the user-visible result, not only a proposed implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: frequency
    attributes:
      label: How often would this help?
      options:
        - Every day
        - Every week
        - Occasionally
        - One specific workflow
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This strengthens fast, local, native visual capture on macOS.
          required: true
        - label: I searched existing issues and PLAN.md first.
          required: true
