name: Release

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install release tooling
        run: pnpm install --frozen-lockfile

      - name: Validate release tag
        run: |
          release_version="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "v$release_version" ]]; then
            printf 'Tag %s does not match package version %s\n' "$RELEASE_TAG" "$release_version" >&2
            exit 1
          fi

      - name: Build and test
        run: >-
          xcodebuild test
          -project Quikanva.xcodeproj
          -scheme Quikanva
          -destination 'platform=macOS'

      - name: Package unsigned app
        run: ./scripts/package-unsigned.sh

      - name: Extract release notes
        run: |
          release_version="$(node -p "require('./package.json').version")"
          awk -v heading="## $release_version" '
            $0 == heading { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            printf 'No CHANGELOG.md entry found for %s\n' "$release_version" >&2
            exit 1
          fi

      - name: Install Sparkle tools
        run: |
          sparkle_version="$(jq -r '.pins[] | select(.identity == "sparkle") | .state.version' \
            Quikanva.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved)"
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$sparkle_version/Sparkle-$sparkle_version.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          echo "$RUNNER_TEMP/sparkle/bin" >> "$GITHUB_PATH"

      - name: Create update feed
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          archive="$(ls dist/*.zip)"
          ./scripts/make-appcast.sh "$archive" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$(basename "$archive")" \
            release-notes.md \
            dist/appcast.xml

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_version="$(node -p "require('./package.json').version")"
          gh release create "$RELEASE_TAG" dist/*.zip dist/appcast.xml \
            --verify-tag \
            --title "Quikanva $release_version" \
            --notes-file release-notes.md
