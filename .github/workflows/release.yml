name: Release

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      NOTARY_PROFILE: quikanva-notary

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install release tooling
        run: pnpm install --frozen-lockfile

      - name: Validate release tag
        run: |
          release_version="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "v$release_version" ]]; then
            printf 'Tag %s does not match package version %s\n' "$RELEASE_TAG" "$release_version" >&2
            exit 1
          fi

      - name: Install signing and notarization credentials
        env:
          SIGNING_KEYCHAIN: ${{ runner.temp }}/quikanva-signing.keychain-db
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          echo "SIGNING_KEYCHAIN=$SIGNING_KEYCHAIN" >> "$GITHUB_ENV"
          for name in DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD HOMEBREW_TAP_TOKEN; do
            if [[ -z "${!name}" ]]; then
              printf 'Required release secret is missing: %s\n' "$name" >&2
              exit 1
            fi
          done
          umask 077
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/quikanva-signing.p12"
          security create-keychain -p "$keychain_password" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 7200 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$SIGNING_KEYCHAIN"
          security import "$RUNNER_TEMP/quikanva-signing.p12" -k "$SIGNING_KEYCHAIN" \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$SIGNING_KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$SIGNING_KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/quikanva-signing.p12"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --keychain "$SIGNING_KEYCHAIN" --apple-id "$APPLE_ID" \
            --team-id NDLJGT2AYB --password "$APPLE_APP_SPECIFIC_PASSWORD"

      - name: Check out Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: mikr13/homebrew-quikanva
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Build and test
        run: >-
          xcodebuild test
          -project Quikanva.xcodeproj
          -scheme Quikanva
          -destination 'platform=macOS'

      - name: Package signed and notarized ZIP and DMG
        run: ./scripts/package-signed.sh

      - name: Extract release notes
        run: |
          release_version="$(node -p "require('./package.json').version")"
          awk -v heading="## $release_version" '
            $0 == heading { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            printf 'No CHANGELOG.md entry found for %s\n' "$release_version" >&2
            exit 1
          fi

      - name: Install Sparkle tools
        run: |
          sparkle_version="$(jq -r '.pins[] | select(.identity == "sparkle") | .state.version' \
            Quikanva.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved)"
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$sparkle_version/Sparkle-$sparkle_version.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          echo "$RUNNER_TEMP/sparkle/bin" >> "$GITHUB_PATH"

      - name: Create update feed
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          release_version="$(node -p "require('./package.json').version")"
          archive="dist/Quikanva-$release_version.zip"
          ./scripts/make-appcast.sh "$archive" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$(basename "$archive")" \
            release-notes.md \
            dist/appcast.xml

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_version="$(node -p "require('./package.json').version")"
          gh release create "$RELEASE_TAG" dist/Quikanva.dmg "dist/Quikanva-$release_version.zip" dist/appcast.xml \
            --verify-tag \
            --title "Quikanva $release_version" \
            --notes-file release-notes.md

      - name: Update Homebrew cask
        working-directory: homebrew-tap
        run: |
          release_version="$(node -p "require('../package.json').version")"
          mkdir -p Casks
          ../scripts/render-homebrew-cask.sh "$release_version" "../dist/Quikanva-$release_version.zip" > Casks/quikanva.rb
          git add Casks/quikanva.rb
          if git diff --cached --quiet; then
            printf 'Homebrew cask already matches %s\n' "$release_version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "quikanva $release_version"
          git push

      - name: Save notarization diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notarization
          path: dist/notary-*.json
          if-no-files-found: ignore

      - name: Remove release credentials
        if: always()
        env:
          SIGNING_KEYCHAIN: ${{ runner.temp }}/quikanva-signing.keychain-db
        run: |
          security list-keychains -d user -s login.keychain-db
          if [[ -f "$SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN"
          fi
          rm -f "$RUNNER_TEMP/quikanva-signing.p12"
