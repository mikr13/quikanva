name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      validate_icloud_profile:
        description: Validate the stored Production iCloud profile only
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: github.event.action != 'closed' && github.head_ref != 'changeset-release/main' && !inputs.validate_icloud_profile
    runs-on: macos-latest
    timeout-minutes: 20
    # A maintainer approves each run in the ci environment, so a push does not start a
    # macOS runner until someone chooses to test that commit. Merging into main
    # requires this job to pass on the latest commit.
    environment:
      name: ci
      deployment: false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install release tooling
        run: pnpm install --frozen-lockfile

      - name: Require a changeset for pull requests
        if: github.event_name == 'pull_request'
        run: pnpm run changeset:status --since=origin/main

      - name: Build and test
        run: >-
          xcodebuild test
          -project Quikanva.xcodeproj
          -scheme Quikanva
          -destination 'platform=macOS'

      - name: Validate iCloud packaging checks
        run: python3 -m unittest discover -s scripts/tests -p 'test_icloud_profile.py'

      - name: Package unsigned app
        run: ./scripts/package-unsigned.sh

      - name: Upload unsigned app
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.zip
          archive: false
          if-no-files-found: error

  validate-icloud-profile:
    if: github.event_name == 'workflow_dispatch' && inputs.validate_icloud_profile
    runs-on: macos-latest
    timeout-minutes: 5
    environment:
      name: ci
      deployment: false

    steps:
      - uses: actions/checkout@v7

      - name: Validate stored Production iCloud provisioning profile
        env:
          ICLOUD_PROVISIONING_PROFILE_BASE64: ${{ secrets.ICLOUD_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [[ -z "$ICLOUD_PROVISIONING_PROFILE_BASE64" ]]; then
            printf 'ICLOUD_PROVISIONING_PROFILE_BASE64 is missing.\n' >&2
            exit 1
          fi
          umask 077
          profile_path="$(mktemp "$RUNNER_TEMP/quikanva-profile.XXXXXX")"
          decoded_path="$profile_path.plist"
          trap 'rm -f "$profile_path" "$decoded_path"' EXIT
          printf '%s' "$ICLOUD_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile_path"
          security cms -D -i "$profile_path" > "$decoded_path"
          python3 scripts/validate-icloud-profile.py "$decoded_path" config/CloudKit-Release.entitlements > /dev/null
          python3 - "$decoded_path" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], 'rb') as source:
              profile = plistlib.load(source)
          if profile.get('ProvisionsAllDevices') is not True:
              sys.exit('The profile must be a Developer ID distribution profile.')
          PY
          printf 'Production iCloud profile passed: Developer ID, team, App ID, container, expiration, CloudKit, and push permissions.\n'
