name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install release tooling
        run: npm ci

      - name: Require a changeset for pull requests
        if: github.event_name == 'pull_request'
        run: npm run changeset:status

      - name: Build and test
        run: >-
          xcodebuild test
          -project Quikanva.xcodeproj
          -scheme Quikanva
          -destination 'platform=macOS'

      - name: Package unsigned app
        run: ./scripts/package-unsigned.sh

      - name: Upload unsigned app
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.zip
          archive: false
          if-no-files-found: error
