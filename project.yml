name: Quikanva
options:
  bundleIdPrefix: com.mihirpandey
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "3.0.0"

targets:
  Quikanva:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Quikanva
      - path: Quikanva.icon
        type: file
        buildPhase: resources
      - path: design/menu-bar/QuikanvaMenuBar.png
        type: file
        buildPhase: resources
    dependencies:
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mihirpandey.quikanva
        PRODUCT_NAME: Quikanva
        ASSETCATALOG_COMPILER_APPICON_NAME: Quikanva
    info:
      path: Quikanva/Resources/Info.plist
      properties:
        LSUIElement: true
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: ""
        CFBundleURLTypes:
          - CFBundleURLName: com.mihirpandey.quikanva
            CFBundleURLSchemes: [quikanva]

  QuikanvaTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: QuikanvaTests
    dependencies:
      - target: Quikanva
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mihirpandey.quikanva.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Quikanva:
    build:
      targets:
        Quikanva: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      targets:
        - QuikanvaTests
